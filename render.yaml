# Blueprint de Render (reconstruido: el original no se pudo leer del .rar)
services:
  - type: web
    name: icecream-api
    runtime: docker
    rootDir: icecream-backend
    plan: free
    healthCheckPath: /config
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ORACLE_WALLET_DIR
        sync: false
      - key: ORACLE_WALLET_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: ICE_CREAM_PRICE
        value: "5000"
      - key: ADMIN_EMAILS
        sync: false
